<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
<title>TO DO LIST</title> 
<!--  <link rel="stylesheet" href="style.css"/> -->
<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
<script src="https://kit.fontawesome.com/8a10e0f309.js" crossorigin="anonymous"></script>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            background-color: blue;
            margin: 0;
        }

 

        .container {

            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 800px;
            text-align: center;
        }

 

        .inputField {
            flex: 1;
            width: 80%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

 

        .btn {
            padding: 10px;
            border: none;
            background-color: #23c048;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }

 

        .btn:hover {
            background-color: #12eb41;
            border: 1px solid black;
        }

        ul {
            padding: 0;
        }

 

        li {
            background-color: #eee;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

 

        li .task-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

 

        li label {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

 

        li .task-text {
            flex: 1;
            text-align: left;
        }

 

        li button {
            border: none;
            background-color: #dc3545;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            padding: 5px 10px;
        }

 

        li button:hover {
            background-color: #c82333;
        }

    </style>

</head>

 

<body>

    <div class="container">

        <i class="fa-solid fa-book-open fa-beat-fade fa-lg" style="color: #74C0FC;"></i>

        <h1>To-Do List</h1>

        <input type="text" id="taskInput" class="inputField" placeholder="Enter a new task">

        <button onclick="addTask()" class="btn">Add Task</button>

        <ul id="taskList" class="list"></ul>

    </div>

 

    <script>

        // Array to store tasks

        let tasks = [];

 

        // Function to add a new task

        function addTask() {

            const taskInput = document.querySelector('#taskInput').value;
            if (taskInput) {
                tasks.push(taskInput);
                document.querySelector('#taskInput').value = '';
                displayTasks();
            } else {
                alert('Please enter a task.');
            }
        }

 

        // Function to display tasks

        function displayTasks() {
            const taskList = document.querySelector('#taskList');
            taskList.innerHTML = ''; // Clear the current list

           

            tasks.forEach((task, index) => {
                const newLi = document.createElement('li');

                // Create container for checkbox, label, and task text

                const taskContent = document.createElement('div');
                taskContent.className = 'task-content';

                // Create checkbox

                const newCheck = document.createElement("input");
                newCheck.type = "checkbox";
                newCheck.id = "myCheck" + index; // Unique ID for each checkbox

               

                // Create label

                const label = document.createElement('label');
                label.textContent = "INCOMPLETE";
                label.htmlFor = "myCheck" + index;

               

                // Create task text span

                const taskText = document.createElement('span');
                taskText.className = 'task-text';
                taskText.textContent = task;

                // Create delete button

                const removeButton = document.createElement('button');
                removeButton.textContent = 'Delete';
                removeButton.onclick = () => removeTask(index);

                

                // Checkbox click handler

                newCheck.onclick = function() {

                    if (newCheck.checked) {
                        label.textContent = "COMPLETE";
                        label.style.backgroundColor = "lightgreen";
                    } else {
                        label.textContent = "INCOMPLETE";
                        label.style.backgroundColor = "";
                    }

                };

               

                // Assemble elements in order: checkbox, label, task text

                taskContent.appendChild(newCheck);
                taskContent.appendChild(label);
                taskContent.appendChild(taskText);

               
                // Add to list item: task content, then delete button

                newLi.appendChild(taskContent);
                newLi.appendChild(removeButton);

                // Add to list

                taskList.appendChild(newLi);

            });

        }

 

        // Function to remove a task

        function removeTask(index) {
            tasks.splice(index, 1);
            displayTasks();
        }

 

        // Allow Enter key to add task

        document.querySelector('#taskInput').addEventListener('keypress', function(e) {

            if (e.key === 'Enter') {
                addTask();
            }
        });

    </script>

</body>

</html>
